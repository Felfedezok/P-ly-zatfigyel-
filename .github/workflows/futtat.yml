name: Pályázatfigyelő futtatása

on:
  schedule:
    # Heti kétszer fut le: Hétfőn és Csütörtökön UTC szerint reggel 6:00-kor (Magyar idő szerint 7:00 vagy 8:00, évszaktól függően)
    - cron: '0 9 * * 1,4'
  workflow_dispatch: # Ezzel maradsz meg a manuális (gombbal indítható) lehetőség is!

jobs:
  futtatas:
    runs-on: ubuntu-latest
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Csomagok telepítése
        run: pip install -r requirements.txt

      - name: Program futtatása
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python main.py
